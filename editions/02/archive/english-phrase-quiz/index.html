<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>English Phrase Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #6C63FF;
  --primary-dark: #5A52D5;
  --accent: #FF6B6B;
  --accent-green: #4ECB71;
  --bg: #1a1a2e;
  --bg-light: #16213e;
  --card: #0f3460;
  --text: #ffffff;
  --text-sub: #a8b2d1;
  --gold: #FFD700;
  --silver: #C0C0C0;
  --bronze: #CD7F32;
}
html, body {
  width: 100%; height: 100%;
  font-family: 'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.screen {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100dvh;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: clamp(16px, 4vw, 32px);
  overflow-y: auto;
}
.screen.active { display: flex; }

/* ========== Title Screen ========== */
#title-screen {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  gap: clamp(16px, 3vh, 28px);
}
.title-icon { font-size: clamp(48px, 12vw, 80px); animation: bounce 2s ease-in-out infinite; }
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.title-main {
  font-size: clamp(28px, 7vw, 48px);
  font-weight: 900;
  background: linear-gradient(135deg, #FFD700, #FF6B6B, #6C63FF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
  line-height: 1.3;
}
.title-sub {
  font-size: clamp(14px, 3.5vw, 18px);
  color: var(--text-sub);
  text-align: center;
}

/* Difficulty selector */
.difficulty-selector {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 8px 0;
}
.diff-btn {
  padding: 12px 24px;
  border: 2px solid var(--primary);
  border-radius: 16px;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: clamp(14px, 3.5vw, 18px);
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  min-width: 100px;
}
.diff-btn:hover, .diff-btn.selected {
  background: var(--primary);
  transform: scale(1.05);
}
.diff-btn.selected { box-shadow: 0 0 20px rgba(108, 99, 255, 0.5); }
.diff-label {
  display: block;
  font-size: clamp(10px, 2.5vw, 12px);
  color: var(--text-sub);
  margin-top: 2px;
  font-weight: 500;
}
.diff-btn.selected .diff-label { color: #ddd; }

.start-btn {
  padding: 16px 48px;
  background: linear-gradient(135deg, var(--primary), #8B5CF6);
  border: none;
  border-radius: 50px;
  color: white;
  font-family: inherit;
  font-size: clamp(18px, 4.5vw, 24px);
  font-weight: 900;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
}
.start-btn:hover { transform: scale(1.05); box-shadow: 0 6px 25px rgba(108, 99, 255, 0.6); }
.start-btn:active { transform: scale(0.98); }

/* ========== Countdown Screen ========== */
#countdown-screen {
  background: var(--bg);
}
.countdown-number {
  font-size: clamp(100px, 25vw, 200px);
  font-weight: 900;
  color: var(--primary);
  animation: countPulse 1s ease-in-out;
}
@keyframes countPulse {
  0% { transform: scale(2); opacity: 0; }
  50% { transform: scale(1); opacity: 1; }
  100% { transform: scale(0.8); opacity: 0.5; }
}

/* ========== Game Screen ========== */
#game-screen {
  background: var(--bg);
  justify-content: flex-start;
  padding-top: clamp(12px, 2vh, 20px);
  gap: 0;
}
.game-header {
  width: 100%;
  max-width: 600px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: clamp(8px, 1.5vh, 12px);
}
.game-info {
  font-size: clamp(14px, 3.5vw, 18px);
  font-weight: 700;
}
.score-display { color: var(--gold); }
.question-counter { color: var(--text-sub); }

/* Timer bar */
.timer-container {
  width: 100%;
  max-width: 600px;
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  margin-bottom: clamp(12px, 2vh, 20px);
  overflow: hidden;
}
.timer-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-green), var(--gold), var(--accent));
  border-radius: 4px;
  transition: width 0.1s linear;
  width: 100%;
}
.timer-bar.danger { background: linear-gradient(90deg, var(--accent), #ff3333); }

/* Question area */
.question-area {
  width: 100%;
  max-width: 600px;
  text-align: center;
  margin-bottom: clamp(12px, 2vh, 24px);
}
.phrase-label {
  font-size: clamp(12px, 3vw, 14px);
  color: var(--text-sub);
  margin-bottom: 8px;
}
.phrase-display {
  font-size: clamp(24px, 6vw, 40px);
  font-weight: 900;
  color: var(--gold);
  padding: clamp(16px, 3vh, 24px);
  background: rgba(255, 215, 0, 0.08);
  border: 2px solid rgba(255, 215, 0, 0.2);
  border-radius: 16px;
  margin-bottom: 8px;
  font-family: 'Segoe UI', 'Arial', sans-serif;
  line-height: 1.3;
}
.phrase-hint {
  font-size: clamp(13px, 3.2vw, 16px);
  color: var(--text-sub);
  font-style: italic;
  min-height: 1.5em;
}
@keyframes fadeIn {
  0% { opacity: 0; transform: translateY(-8px); }
  100% { opacity: 1; transform: translateY(0); }
}
.question-prompt {
  font-size: clamp(15px, 3.8vw, 20px);
  font-weight: 700;
  color: var(--text);
  margin-top: clamp(8px, 1.5vh, 16px);
}

/* Choices */
.choices-container {
  width: 100%;
  max-width: 600px;
  display: flex;
  flex-direction: column;
  gap: clamp(8px, 1.5vh, 12px);
}
.choice-btn {
  width: 100%;
  padding: clamp(14px, 2.5vh, 20px) 20px;
  background: var(--card);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  color: var(--text);
  font-family: inherit;
  font-size: clamp(14px, 3.5vw, 17px);
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
  line-height: 1.4;
  position: relative;
  overflow: hidden;
}
.choice-btn:hover:not(.disabled) {
  border-color: var(--primary);
  background: rgba(108, 99, 255, 0.15);
  transform: translateX(4px);
}
.choice-btn:active:not(.disabled) { transform: scale(0.98); }
.choice-btn .choice-label {
  position: absolute;
  left: 16px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px;
  background: rgba(255,255,255,0.1);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900;
  font-size: 14px;
}
.choice-btn .choice-text { margin-left: 40px; display: block; }

.choice-btn.correct {
  background: rgba(78, 203, 113, 0.2);
  border-color: var(--accent-green);
  animation: correctFlash 0.5s;
}
.choice-btn.correct .choice-label { background: var(--accent-green); }
@keyframes correctFlash {
  0%, 100% { box-shadow: none; }
  50% { box-shadow: 0 0 30px rgba(78, 203, 113, 0.5); }
}
.choice-btn.wrong {
  background: rgba(255, 107, 107, 0.2);
  border-color: var(--accent);
  animation: wrongShake 0.4s;
}
.choice-btn.wrong .choice-label { background: var(--accent); }
@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
.choice-btn.disabled { opacity: 0.5; pointer-events: none; }

/* Points popup */
.points-popup {
  position: fixed;
  top: 30%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(32px, 8vw, 56px);
  font-weight: 900;
  pointer-events: none;
  z-index: 100;
  animation: pointsFly 1s ease-out forwards;
}
.points-popup.plus { color: var(--accent-green); }
.points-popup.zero { color: var(--accent); }
@keyframes pointsFly {
  0% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
  100% { opacity: 0; transform: translate(-50%, -150%) scale(0.8); }
}

/* ========== Result Screen ========== */
#result-screen {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  gap: clamp(12px, 2vh, 20px);
}
.result-title {
  font-size: clamp(24px, 6vw, 36px);
  font-weight: 900;
}
.result-score-box {
  background: rgba(255, 215, 0, 0.1);
  border: 2px solid rgba(255, 215, 0, 0.3);
  border-radius: 20px;
  padding: clamp(20px, 4vh, 32px) clamp(32px, 8vw, 64px);
  text-align: center;
}
.result-score-label { font-size: clamp(14px, 3.5vw, 16px); color: var(--text-sub); }
.result-score-value {
  font-size: clamp(48px, 12vw, 72px);
  font-weight: 900;
  color: var(--gold);
  line-height: 1.2;
}
.result-score-unit { font-size: clamp(16px, 4vw, 20px); color: var(--text-sub); }

.result-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  max-width: 400px;
}
.stat-item {
  background: var(--card);
  border-radius: 12px;
  padding: 12px;
  text-align: center;
}
.stat-value {
  font-size: clamp(20px, 5vw, 28px);
  font-weight: 900;
}
.stat-label {
  font-size: clamp(11px, 2.8vw, 13px);
  color: var(--text-sub);
}
.stat-correct .stat-value { color: var(--accent-green); }
.stat-wrong .stat-value { color: var(--accent); }

.result-grade {
  font-size: clamp(16px, 4vw, 22px);
  font-weight: 700;
  padding: 8px 24px;
  border-radius: 50px;
  text-align: center;
}

.result-buttons {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
.result-btn {
  padding: 14px 32px;
  border: none;
  border-radius: 50px;
  font-family: inherit;
  font-size: clamp(15px, 3.8vw, 18px);
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
}
.result-btn:hover { transform: scale(1.05); }
.retry-btn { background: linear-gradient(135deg, var(--primary), #8B5CF6); color: white; }
.home-btn { background: rgba(255,255,255,0.1); color: var(--text); border: 2px solid rgba(255,255,255,0.2) !important; }

/* ========== Ranking Screen ========== */
#ranking-screen {
  background: var(--bg);
  justify-content: flex-start;
  padding-top: clamp(16px, 3vh, 24px);
  gap: clamp(12px, 2vh, 16px);
}
.ranking-title {
  font-size: clamp(22px, 5.5vw, 32px);
  font-weight: 900;
}
.ranking-tabs {
  display: flex;
  gap: 0;
  background: rgba(255,255,255,0.05);
  border-radius: 12px;
  overflow: hidden;
}
.rank-tab {
  padding: 10px 24px;
  background: transparent;
  border: none;
  color: var(--text-sub);
  font-family: inherit;
  font-size: clamp(14px, 3.5vw, 16px);
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
}
.rank-tab.active { background: var(--primary); color: white; }
.ranking-list {
  width: 100%;
  max-width: 500px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  max-height: 50vh;
  padding: 4px;
}
.rank-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--card);
  border-radius: 12px;
}
.rank-pos {
  font-size: clamp(16px, 4vw, 20px);
  font-weight: 900;
  width: 36px;
  text-align: center;
}
.rank-pos.gold { color: var(--gold); }
.rank-pos.silver { color: var(--silver); }
.rank-pos.bronze { color: var(--bronze); }
.rank-info { flex: 1; }
.rank-score {
  font-size: clamp(16px, 4vw, 20px);
  font-weight: 900;
  color: var(--gold);
}
.rank-diff {
  font-size: clamp(11px, 2.5vw, 12px);
  color: var(--text-sub);
}
.rank-detail {
  font-size: clamp(11px, 2.5vw, 12px);
  color: var(--text-sub);
}
.rank-empty {
  text-align: center;
  color: var(--text-sub);
  padding: 32px;
}
.back-btn {
  padding: 12px 32px;
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 50px;
  color: var(--text);
  font-family: inherit;
  font-size: clamp(14px, 3.5vw, 16px);
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
}
</style>
</head>
<body>

<!-- ===== TITLE SCREEN ===== -->
<div id="title-screen" class="screen active">
  <div class="title-icon">📝</div>
  <div class="title-main">English<br>Phrase Quiz</div>
  <div class="title-sub">英語フレーズの使い方を当てよう！<br>速く答えるほど高得点🔥</div>
  <div style="font-size:clamp(14px,3.5vw,16px); font-weight:700; color:var(--text-sub);">難易度を選んでね</div>
  <div class="difficulty-selector">
    <button class="diff-btn" data-diff="easy" onclick="selectDifficulty('easy')">
      🌱 初級<span class="diff-label">基本フレーズ</span>
    </button>
    <button class="diff-btn selected" data-diff="medium" onclick="selectDifficulty('medium')">
      🔥 中級<span class="diff-label">日常表現</span>
    </button>
    <button class="diff-btn" data-diff="hard" onclick="selectDifficulty('hard')">
      💀 上級<span class="diff-label">ネイティブ表現</span>
    </button>
    <button class="diff-btn" data-diff="travel" onclick="selectDifficulty('travel')">
      ✈️ 旅行編<span class="diff-label">海外旅行</span>
    </button>
  </div>
  <button class="start-btn" onclick="startGame()">スタート！</button>
  <button class="back-btn" onclick="showRanking()" style="font-size:clamp(13px,3vw,15px); padding:8px 20px;">🏆 ランキング</button>
</div>

<!-- ===== COUNTDOWN SCREEN ===== -->
<div id="countdown-screen" class="screen">
  <div class="countdown-number" id="countdown-num">3</div>
</div>

<!-- ===== GAME SCREEN ===== -->
<div id="game-screen" class="screen">
  <div class="game-header">
    <div class="game-info question-counter" id="q-counter">Q1 / 10</div>
    <div class="game-info score-display" id="score-display">🔥 0 pt</div>
  </div>
  <div class="timer-container">
    <div class="timer-bar" id="timer-bar"></div>
  </div>
  <div class="question-area">
    <div class="phrase-label">この英語フレーズ…</div>
    <div class="phrase-display" id="phrase-display">break the ice</div>
    <div class="phrase-hint" id="phrase-hint"></div>
    <div class="question-prompt">👇 どんな場面で使う？</div>
  </div>
  <div class="choices-container" id="choices-container"></div>
</div>

<!-- ===== RESULT SCREEN ===== -->
<div id="result-screen" class="screen">
  <div class="result-title">🎉 結果発表</div>
  <div class="result-score-box">
    <div class="result-score-label">あなたのスコア</div>
    <div class="result-score-value" id="final-score">0</div>
    <div class="result-score-unit">points</div>
  </div>
  <div class="result-stats">
    <div class="stat-item stat-correct">
      <div class="stat-value" id="correct-count">0</div>
      <div class="stat-label">⭕ 正解</div>
    </div>
    <div class="stat-item stat-wrong">
      <div class="stat-value" id="wrong-count">0</div>
      <div class="stat-label">❌ 不正解</div>
    </div>
  </div>
  <div class="result-grade" id="result-grade"></div>
  <div class="result-buttons">
    <button class="result-btn retry-btn" onclick="startGame()">🔄 もう一度</button>
    <button class="result-btn home-btn" onclick="showScreen('title-screen'); stopBGM();">🏠 タイトル</button>
  </div>
  <button class="back-btn" onclick="showRanking()" style="margin-top:4px;">🏆 ランキング</button>
</div>

<!-- ===== RANKING SCREEN ===== -->
<div id="ranking-screen" class="screen">
  <div class="ranking-title">🏆 ランキング</div>
  <div class="ranking-tabs">
    <button class="rank-tab active" onclick="switchRankTab('all')" id="tab-all">🌟 全記録</button>
    <button class="rank-tab" onclick="switchRankTab('easy')" id="tab-easy">🌱 初級</button>
    <button class="rank-tab" onclick="switchRankTab('medium')" id="tab-medium">🔥 中級</button>
    <button class="rank-tab" onclick="switchRankTab('hard')" id="tab-hard">💀 上級</button>
  </div>
  <div class="ranking-list" id="ranking-list"></div>
  <button class="back-btn" onclick="showScreen('title-screen')">← 戻る</button>
</div>

<script>
// ===== QUESTIONS DATABASE =====
const QUESTIONS = {
easy: [
  { phrase: "Thank you", hint: "感謝を伝える基本表現", correct: "友達がプレゼントをくれた時", wrong: ["道に迷って困っている時","誰かに謝りたい時","自己紹介をする時"] },
  { phrase: "Excuse me", hint: "注意を引く・許可を求める", correct: "混んだ電車で降りたい時", wrong: ["お腹が空いた時","うれしいニュースを聞いた時","寝る前の挨拶"] },
  { phrase: "No problem", hint: "問題ないよ、大丈夫", correct: "お礼を言われて「気にしないで」と返す時", wrong: ["テストで0点を取った時","道に迷った時","注文を決める時"] },
  { phrase: "I'm sorry", hint: "謜罪・残念な気持ち", correct: "約束の時間に遅刻してしまった時", wrong: ["美味しい料理を食べた時","天気がいい日","久しぶりに友達に会った時"] },
  { phrase: "Good luck", hint: "幸運を祜る", correct: "明日テストがある友達を励ます時", wrong: ["夕食のメニューを決める時","道を尋ねる時","映画の感想を聞く時"] },
  { phrase: "That's great!", hint: "いいね！素晴らしい！", correct: "友達が試験に合格したと聞いた時", wrong: ["とても悲しいニュースを聞いた時","電車を乗り間違えた時","忘れ物をした時"] },
  { phrase: "Take care", hint: "気をつけてね", correct: "友達と別れる時に声をかける", wrong: ["初対面で自己紹介する時","料理を注文する時","写真を撮る時"] },
  { phrase: "Never mind", hint: "気にしないで", correct: "相手が聞き返してきたけど大したことじゃない時", wrong: ["大事な発表をする前","デートに誘う時","テスト勉強を始める時"] },
  { phrase: "Sounds good", hint: "いいね、それで行こう", correct: "ランチにカレーを提案されて賛成する時", wrong: ["映画がつまらなかった時","財布を忘れた時","頭が痛い時"] },
  { phrase: "I'm fine", hint: "大丈夫、元気です", correct: "「調子どう？」と聞かれて答える時", wrong: ["レストランで注文する時","道を教える時","買い物リストを作る時"] },
  { phrase: "See you later", hint: "またね", correct: "学校帰りに友達と別れる時", wrong: ["初めて会った人に自己紹介する時","惔っている時","朝起きた時"] },
  { phrase: "You're welcome", hint: "どういたしまして", correct: "お礼を言われた時に返す", wrong: ["注文を間違えた時","道を聞く時","映画のチケットを買う時"] },
  { phrase: "Go ahead", hint: "どうぞ", correct: "エレベーターで相手を先に通す時", wrong: ["テスト中にわからない問題がある時","お腹がいっぱいの時","寝坊した時"] },
  { phrase: "Let me see", hint: "えーっと、見せて", correct: "メニューを見て何を頼むか考える時", wrong: ["全速力で走る時","風邪をひいた時","ゲームに勝った時"] },
  { phrase: "Just a moment", hint: "ちょっと待ってね", correct: "電話で保留にする時", wrong: ["ジョークを言う時","おやすみの挨拶","お土産を渡す時"] },
  { phrase: "Nice to meet you", hint: "はじめまして", correct: "初対面の人に挨拶する時", wrong: ["友達と別れる時","電話を切る時","お礼を言う時"] },
  { phrase: "Help yourself", hint: "自分でどうぞ", correct: "食べ物を自由に取ってという時", wrong: ["助けを求める時","自己紹介する時","謝る時"] },

// ===== AUDIO =====
let audioCtx = null;
let bgmInterval = null;
let bgmOscillators = [];
let bgmGain = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSE(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  if (type === 'correct') {
    // Happy ascending arpeggio
    [0, 0.08, 0.16].forEach((delay, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.value = [523, 659, 784][i]; // C5, E5, G5
      gain.gain.setValueAtTime(0.25, now + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.3);
      osc.start(now + delay);
      osc.stop(now + delay + 0.3);
    });
  } else if (type === 'wrong') {
    // Buzzer sound
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sawtooth';
    osc.frequency.value = 150;
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.start(now);
    osc.stop(now + 0.4);
  } else if (type === 'countdown') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.start(now);
    osc.stop(now + 0.15);
  } else if (type === 'go') {
    [0, 0.1, 0.2].forEach((delay, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'square';
      osc.frequency.value = [440, 554, 880][i];
      gain.gain.setValueAtTime(0.12, now + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.2);
      osc.start(now + delay);
      osc.stop(now + delay + 0.2);
    });
  } else if (type === 'tick') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = 1000;
    gain.gain.setValueAtTime(0.06, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    osc.start(now);
    osc.stop(now + 0.05);
  } else if (type === 'timewarning') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.value = 600;
    osc.frequency.exponentialRampToValueAtTime(300, now + 0.3);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.start(now);
    osc.stop(now + 0.3);
  } else if (type === 'result') {
    // Fanfare
    const notes = [523, 659, 784, 1047];
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, now + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.4);
      osc.start(now + i * 0.15);
      osc.stop(now + i * 0.15 + 0.4);
    });
  }
}

// BGM: tense ticking background
function startBGM() {
  if (!audioCtx) return;
  stopBGM();

  bgmGain = audioCtx.createGain();
  bgmGain.gain.value = 0.04;
  bgmGain.connect(audioCtx.destination);

  // Low drone
  const drone = audioCtx.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 110;
  drone.connect(bgmGain);
  drone.start();
  bgmOscillators.push(drone);

  // Subtle pulsing
  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.type = 'sine';
  lfo.frequency.value = 2;
  lfoGain.gain.value = 0.02;
  lfo.connect(lfoGain);
  lfoGain.connect(bgmGain.gain);
  lfo.start();
  bgmOscillators.push(lfo);

  // Ticking rhythm
  bgmInterval = setInterval(() => {
    if (audioCtx && bgmGain) {
      const now = audioCtx.currentTime;
      const tick = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      tick.connect(g);
      g.connect(audioCtx.destination);
      tick.type = 'sine';
      tick.frequency.value = timeLeft <= 5 ? 800 : 600;
      g.gain.setValueAtTime(timeLeft <= 5 ? 0.08 : 0.04, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      tick.start(now);
      tick.stop(now + 0.05);
    }
  }, timeLeft <= 5 ? 250 : 500);
}

function stopBGM() {
  if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
  bgmOscillators.forEach(o => { try { o.stop(); } catch(e){} });
  bgmOscillators = [];
  bgmGain = null;
}

// ===== SCREEN MANAGEMENT =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== DIFFICULTY =====
function selectDifficulty(diff) {
  currentDifficulty = diff;
  document.querySelectorAll('.diff-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.diff === diff);
  });
}

// ===== GAME FLOW =====
function startGame() {
  initAudio();
  score = 0;
  correctCount = 0;
  wrongCount = 0;
  currentQ = 0;

  // Shuffle and pick questions
  const pool = [...QUESTIONS[currentDifficulty]];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  currentQuestions = pool.slice(0, TOTAL_Q);

  // Countdown
  showScreen('countdown-screen');
  let count = 3;
  const countEl = document.getElementById('countdown-num');
  countEl.textContent = count;
  countEl.style.animation = 'none';
  void countEl.offsetWidth;
  countEl.style.animation = 'countPulse 1s ease-in-out';
  playSE('countdown');

  const countdownTimer = setInterval(() => {
    count--;
    if (count > 0) {
      countEl.textContent = count;
      countEl.style.animation = 'none';
      void countEl.offsetWidth;
      countEl.style.animation = 'countPulse 1s ease-in-out';
      playSE('countdown');
    } else {
      clearInterval(countdownTimer);
      countEl.textContent = 'GO!';
      countEl.style.color = 'var(--accent-green)';
      countEl.style.animation = 'none';
      void countEl.offsetWidth;
      countEl.style.animation = 'countPulse 1s ease-in-out';
      playSE('go');
      setTimeout(() => {
        countEl.style.color = 'var(--primary)';
        showScreen('game-screen');
        showQuestion();
        startBGM();
      }, 600);
    }
  }, 1000);
}

function showQuestion() {
  answered = false;
  const q = currentQuestions[currentQ];

  document.getElementById('q-counter').textContent = `Q${currentQ + 1} / ${TOTAL_Q}`;
  document.getElementById('score-display').textContent = `🔥 ${score} pt`;
  document.getElementById('phrase-display').textContent = q.phrase;
  const hintEl = document.getElementById('phrase-hint');
    hintEl.textContent = '';
    hintEl.dataset.hintText = q.hint ? '💡 ' + q.hint : '';

  // Shuffle choices
  const choices = [
    { text: q.correct, isCorrect: true },
    ...q.wrong.map(w => ({ text: w, isCorrect: false }))
  ];
  for (let i = choices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [choices[i], choices[j]] = [choices[j], choices[i]];
  }

  const container = document.getElementById('choices-container');
  container.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];
  choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-label">${labels[i]}</span><span class="choice-text">${c.text}</span>`;
    btn.onclick = () => handleAnswer(btn, c.isCorrect, container);
    container.appendChild(btn);
  });

  // Start timer
  timeLeft = TIME_LIMIT;
  const timerBar = document.getElementById('timer-bar');
  timerBar.style.width = '100%';
  timerBar.classList.remove('danger');

  if (timerInterval) clearInterval(timerInterval);
  const startTime = Date.now();
  timerInterval = setInterval(() => {
    if (answered) return;
    const elapsed = (Date.now() - startTime) / 1000;
    timeLeft = Math.max(0, TIME_LIMIT - elapsed);
    const pct = (timeLeft / TIME_LIMIT) * 100;
    timerBar.style.width = pct + '%';

    if (timeLeft <= 5) {
      timerBar.classList.add('danger');
      // Restart BGM with faster ticks
      if (bgmInterval) { clearInterval(bgmInterval); }
      bgmInterval = setInterval(() => {
        if (audioCtx) {
          const now = audioCtx.currentTime;
          const tick = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          tick.connect(g); g.connect(audioCtx.destination);
          tick.type = 'sine';
          tick.frequency.value = 800;
          g.gain.setValueAtTime(0.08, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          tick.start(now);
          tick.stop(now + 0.04);
        }
      }, 200);
    }

    if (timeLeft <= TIME_LIMIT * 0.5) {
      const hintEl = document.getElementById('phrase-hint');
      if (hintEl.textContent === '' && hintEl.dataset.hintText) {
        hintEl.textContent = hintEl.dataset.hintText;
        hintEl.style.animation = 'none';
        void hintEl.offsetWidth;
        hintEl.style.animation = 'fadeIn 0.5s ease-in';
      }
    }
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      handleTimeout(container);
    }
  }, 50);
}

function handleAnswer(btn, isCorrect, container) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  // Disable all buttons
  container.querySelectorAll('.choice-btn').forEach(b => b.classList.add('disabled'));

  if (isCorrect) {
    btn.classList.add('correct');
    // Score based on remaining time
    const timeBonus = Math.round((timeLeft / TIME_LIMIT) * 800) + 200;
    score += timeBonus;
    correctCount++;
    playSE('correct');
    showPointsPopup(`+${timeBonus}`, true);

    // Also highlight correct for feedback
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    playSE('wrong');
    showPointsPopup('+0', false);

    // Show correct answer
    container.querySelectorAll('.choice-btn').forEach(b => {
      const text = b.querySelector('.choice-text').textContent;
      if (text === currentQuestions[currentQ].correct) {
        b.classList.add('correct');
      }
    });
  }

  document.getElementById('score-display').textContent = `🔥 ${score} pt`;

  setTimeout(() => nextQuestion(), 1500);
}

function handleTimeout(container) {
  if (answered) return;
  answered = true;
  wrongCount++;
  playSE('timewarning');
  showPointsPopup('⏰ TIME UP', false);

  container.querySelectorAll('.choice-btn').forEach(b => {
    b.classList.add('disabled');
    const text = b.querySelector('.choice-text').textContent;
    if (text === currentQuestions[currentQ].correct) {
      b.classList.add('correct');
    }
  });

  setTimeout(() => nextQuestion(), 1500);
}

function showPointsPopup(text, isPlus) {
  const popup = document.createElement('div');
  popup.className = `points-popup ${isPlus ? 'plus' : 'zero'}`;
  popup.textContent = text;
  document.body.appendChild(popup);
  setTimeout(() => popup.remove(), 1000);
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= TOTAL_Q) {
    showResult();
  } else {
    // Reset BGM speed
    stopBGM();
    startBGM();
    showQuestion();
  }
}

function showResult() {
  stopBGM();
  if (timerInterval) clearInterval(timerInterval);
  playSE('result');

  document.getElementById('final-score').textContent = score;
  document.getElementById('correct-count').textContent = correctCount;
  document.getElementById('wrong-count').textContent = wrongCount;

  // Grade
  const pct = correctCount / TOTAL_Q;
  const gradeEl = document.getElementById('result-grade');
  let gradeText, gradeBg;
  if (pct >= 0.9) { gradeText = '🏆 Excellent! ネイティブ級！'; gradeBg = 'rgba(255,215,0,0.2)'; }
  else if (pct >= 0.7) { gradeText = '🎯 Great! いい感じ！'; gradeBg = 'rgba(78,203,113,0.2)'; }
  else if (pct >= 0.5) { gradeText = '💪 Good! もう少し！'; gradeBg = 'rgba(108,99,255,0.2)'; }
  else { gradeText = '📚 Keep going! 復習しよう！'; gradeBg = 'rgba(255,107,107,0.2)'; }
  gradeEl.textContent = gradeText;
  gradeEl.style.background = gradeBg;

  // Save to local storage
  saveScore();

  // Animate score
  const scoreEl = document.getElementById('final-score');
  let displayScore = 0;
  const step = Math.max(1, Math.floor(score / 30));
  const scoreAnim = setInterval(() => {
    displayScore = Math.min(displayScore + step, score);
    scoreEl.textContent = displayScore;
    if (displayScore >= score) clearInterval(scoreAnim);
  }, 30);

  showScreen('result-screen');
}

// ===== LOCAL RANKING =====
function saveScore() {
  const key = 'epq-scores';
  const scores = JSON.parse(localStorage.getItem(key) || '[]');
  const diffLabels = { easy: '初級', medium: '中級', hard: '上級', travel: '旅行編' };
  scores.push({
    score,
    correct: correctCount,
    total: TOTAL_Q,
    difficulty: currentDifficulty,
    diffLabel: diffLabels[currentDifficulty],
    date: new Date().toLocaleDateString('ja-JP')
  });
  scores.sort((a, b) => b.score - a.score);
  if (scores.length > 50) scores.length = 50;
  localStorage.setItem(key, JSON.stringify(scores));
}

function showRanking(filterDiff = 'all') {
  showScreen('ranking-screen');
  renderRanking(filterDiff);
}

function switchRankTab(diff) {
  document.querySelectorAll('.rank-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${diff}`).classList.add('active');
  renderRanking(diff);
}

function renderRanking(filterDiff) {
  const scores = JSON.parse(localStorage.getItem('epq-scores') || '[]');
  const filtered = filterDiff === 'all' ? scores : scores.filter(s => s.difficulty === filterDiff);
  const list = document.getElementById('ranking-list');

  if (filtered.length === 0) {
    list.innerHTML = '<div class="rank-empty">まだ記録がありません<br>プレイして記録を残そう！🎮</div>';
    return;
  }

  list.innerHTML = filtered.map((s, i) => {
    const posClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}`;
    return `
      <div class="rank-item">
        <div class="rank-pos ${posClass}">${medal}</div>
        <div class="rank-info">
          <div class="rank-diff">${s.diffLabel} | ${s.date}</div>
        </div>
        <div style="text-align:right;">
          <div class="rank-score">${s.score}</div>
          <div class="rank-detail">${s.correct}/${s.total} 正解</div>
        </div>
      </div>
    `;
  }).join('');
}
</script>
