<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⌨️ 反射キーボード・スマッシュ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a1a;
    --card: #151530;
    --accent: #ff6b35;
    --accent2: #00e5ff;
    --success: #00e676;
    --fail: #ff1744;
    --text: #ffffff;
    --dim: #8888aa;
  }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100dvh; padding: 20px; }
  .screen.active { display: flex; }

  /* Title Screen */
  #title-screen { gap: 20px; background: radial-gradient(ellipse at center, #1a1a3a 0%, var(--bg) 70%); }
  .game-logo { font-size: clamp(2.2rem, 7vw, 4.5rem); font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; line-height: 1.2; }
  .game-subtitle { color: var(--dim); font-size: clamp(0.9rem, 2.5vw, 1.2rem); text-align: center; margin-bottom: 10px; }

  .btn {
    padding: 16px 48px; font-size: 1.3rem; font-weight: 700;
    border: none; border-radius: 60px; cursor: pointer;
    transition: all 0.2s; font-family: inherit;
  }
  .btn:active { transform: scale(0.95); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #ff8a50); color: #fff; box-shadow: 0 4px 20px rgba(255,107,53,0.4); }
  .btn-secondary { background: transparent; color: var(--accent2); border: 2px solid var(--accent2); padding: 12px 36px; font-size: 1rem; }

  .best-score-display { color: var(--accent2); font-size: 1rem; margin-top: 8px; }

  .rule-box {
    background: var(--card); border-radius: 16px; padding: 16px 20px;
    max-width: 340px; width: 100%; text-align: left;
    color: var(--dim); font-size: 0.85rem; line-height: 1.7;
  }
  .rule-box b { color: var(--text); }

  /* Sound toggle */
  .sound-toggle {
    position: fixed; top: 12px; right: 12px; z-index: 200;
    background: var(--card); border: 1px solid rgba(255,255,255,0.15);
    color: var(--text); font-size: 1.4rem; width: 44px; height: 44px;
    border-radius: 50%; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }
  .sound-toggle:active { transform: scale(0.9); }

  /* Countdown */
  #countdown-screen { background: var(--bg); }
  .countdown-number {
    font-size: clamp(8rem, 30vw, 16rem); font-weight: 900;
    animation: countPulse 0.6s ease-out;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  @keyframes countPulse {
    0% { transform: scale(2); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Game Screen */
  #game-screen { padding: 0; position: relative; background: var(--bg); }

  .game-hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; background: rgba(0,0,0,0.5);
    z-index: 10; font-size: clamp(0.85rem, 2vw, 1rem);
  }
  .hud-score { color: var(--accent); font-weight: 700; }
  .hud-combo { color: var(--accent2); font-weight: 700; }
  .hud-timer { color: var(--text); font-weight: 700; }

  .timer-bar {
    position: absolute; top: 48px; left: 0; right: 0; height: 4px;
    background: rgba(255,255,255,0.1); z-index: 10;
  }
  .timer-bar-fill { height: 100%; background: var(--accent2); transition: width 0.05s linear; }

  .question-area {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 60px 16px 16px; width: 100%; gap: 8px;
  }

  .level-badge {
    font-size: 0.8rem; font-weight: 700; padding: 4px 14px;
    border-radius: 20px; margin-bottom: 4px;
  }
  .level-1 { background: rgba(0,230,118,0.2); color: var(--success); }
  .level-2 { background: rgba(255,107,53,0.2); color: var(--accent); }
  .level-3 { background: rgba(255,23,68,0.2); color: var(--fail); }

  .question-display {
    font-size: clamp(3rem, 12vw, 7rem); font-weight: 900;
    text-align: center; line-height: 1.2;
    min-height: 80px; display: flex; align-items: center; justify-content: center;
    animation: questionIn 0.2s ease-out;
  }
  @keyframes questionIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .romaji-hint {
    font-size: clamp(1rem, 3vw, 1.5rem); color: var(--dim);
    font-weight: 700; min-height: 28px;
  }

  .typing-area {
    width: 100%; max-width: 400px; margin-top: 12px;
    position: relative;
  }

  .typing-progress {
    display: flex; justify-content: center; gap: 4px;
    flex-wrap: wrap; margin-bottom: 12px; min-height: 40px;
    align-items: center;
  }
  .char-box {
    width: clamp(28px, 7vw, 40px); height: clamp(34px, 8vw, 48px);
    border: 2px solid rgba(255,255,255,0.2); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(1rem, 3vw, 1.5rem); font-weight: 700;
    background: var(--card); transition: all 0.15s;
  }
  .char-box.filled { border-color: var(--accent2); color: var(--accent2); background: rgba(0,229,255,0.1); }
  .char-box.current { border-color: var(--accent); animation: cursorBlink 0.8s infinite; }
  .char-box.correct-char { border-color: var(--success); color: var(--success); background: rgba(0,230,118,0.1); }
  @keyframes cursorBlink {
    0%, 100% { border-color: var(--accent); }
    50% { border-color: rgba(255,107,53,0.3); }
  }

  .hidden-input {
    position: absolute; left: -9999px; top: -9999px;
    opacity: 0; width: 1px; height: 1px;
  }

  .tap-to-type {
    color: var(--dim); font-size: 0.85rem; margin-top: 8px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .kb-hint { color: var(--dim); font-size: 0.8rem; margin-top: 8px; }

  /* Flash overlay */
  .flash-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 100;
    animation: flash 0.3s ease-out forwards;
  }
  .flash-correct { background: rgba(0, 230, 118, 0.25); }
  .flash-wrong   { background: rgba(255, 23, 68, 0.4); }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* Combo popup */
  .combo-popup {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(2rem, 8vw, 4rem); font-weight: 900;
    pointer-events: none; z-index: 50;
    animation: comboAnim 0.8s ease-out forwards;
    color: var(--accent2); text-shadow: 0 0 30px rgba(0, 229, 255, 0.6);
  }
  @keyframes comboAnim {
    0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    30%  { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -80%) scale(1); opacity: 0; }
  }

  /* Speed bonus popup */
  .speed-popup {
    position: fixed; top: 30%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(1rem, 4vw, 1.8rem); font-weight: 900;
    pointer-events: none; z-index: 50;
    animation: speedAnim 0.6s ease-out forwards;
    color: var(--accent);
  }
  @keyframes speedAnim {
    0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    30%  { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    100% { transform: translate(-50%, -80%) scale(1); opacity: 0; }
  }

  /* Result Screen */
  #result-screen { gap: 14px; background: radial-gradient(ellipse at center, #1a1a3a 0%, var(--bg) 70%); }
  .result-label { font-size: 1.2rem; color: var(--dim); }
  .result-score {
    font-size: clamp(4rem, 15vw, 8rem); font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .result-stats { text-align: center; color: var(--dim); line-height: 2; font-size: 1rem; }
  .result-new-record { color: var(--accent); font-weight: 700; font-size: 1.2rem; animation: pulse 1s infinite; }

  /* Name input */
  .name-input-area { display: flex; gap: 8px; margin-top: 8px; width: 100%; max-width: 300px; }
  .name-input-area input {
    flex: 1; padding: 12px 16px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.2); background: var(--card);
    color: var(--text); font-size: 1rem; font-family: inherit; outline: none;
  }
  .name-input-area input:focus { border-color: var(--accent2); }
  .save-status { font-size: 0.85rem; margin-top: 4px; min-height: 20px; }

  /* Ranking Screen */
  #ranking-screen { gap: 16px; padding: 20px; overflow-y: auto; justify-content: flex-start; padding-top: 40px; }
  .ranking-title { font-size: 1.8rem; font-weight: 900; color: var(--accent2); margin-bottom: 8px; }
  .ranking-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .ranking-tab {
    padding: 8px 20px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.15);
    background: transparent; color: var(--dim); font-weight: 700;
    cursor: pointer; font-family: inherit; font-size: 0.9rem;
  }
  .ranking-tab.active { background: var(--accent2); color: #000; border-color: var(--accent2); }
  .ranking-list { width: 100%; max-width: 400px; }
  .ranking-item {
    display: flex; align-items: center; padding: 14px 16px;
    background: var(--card); border-radius: 12px; margin-bottom: 8px; gap: 12px;
  }
  .rank-num { font-size: 1.4rem; font-weight: 900; min-width: 40px; text-align: center; }
  .rank-1 { color: #ffd700; } .rank-2 { color: #c0c0c0; } .rank-3 { color: #cd7f32; }
  .rank-name { flex: 1; font-weight: 700; }
  .rank-score { color: var(--accent2); font-weight: 700; font-size: 1.1rem; }
  .rank-date { color: var(--dim); font-size: 0.75rem; }
  .ranking-loading { text-align: center; color: var(--dim); padding: 40px; }
  .ranking-loading .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--dim); border-top-color: var(--accent2); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Sound Toggle -->
<button class="sound-toggle" id="sound-toggle" onclick="toggleSound()">🔊</button>

<!-- Title Screen -->
<div id="title-screen" class="screen active">
  <div class="game-logo">⌨️ 反射キーボード<br>スマッシュ</div>
  <div class="game-subtitle">表示される文字をタイプしよう</div>
  <button class="btn btn-primary" onclick="startGame()">スタート</button>
  <button class="btn btn-secondary" onclick="showRanking()">🏆 ランキング</button>
  <div class="best-score-display" id="best-score-display"></div>
  <div class="rule-box">
    <b>ルール</b><br>
    ・制限時間 <b>30秒</b><br>
    ・表示される文字・単語をタイプ<br>
    ・1文字 <b>10点</b> + スピードボーナス<br>
    ・<b>5連続正解</b> ごとにコンボボーナス +50点<br>
    ・レベルは自動で上がっていくよ
  </div>
  <div class="kb-hint" id="device-hint"></div>
</div>

<!-- Countdown Screen -->
<div id="countdown-screen" class="screen">
  <div class="countdown-number" id="countdown-num">3</div>
</div>

<!-- Game Screen -->
<div id="game-screen" class="screen">
  <div class="game-hud">
    <div class="hud-score">スコア: <span id="hud-score">0</span></div>
    <div class="hud-combo" id="hud-combo"></div>
    <div class="hud-timer">⏱ <span id="hud-timer">30.0</span>s</div>
  </div>
  <div class="timer-bar"><div class="timer-bar-fill" id="timer-bar-fill"></div></div>

  <div class="question-area" id="question-area">
    <div class="level-badge level-1" id="level-badge">EASY</div>
    <div class="question-display" id="question-display"></div>
    <div class="romaji-hint" id="romaji-hint"></div>
    <div class="typing-area">
      <div class="typing-progress" id="typing-progress"></div>
      <input type="text" class="hidden-input" id="hidden-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin">
    </div>
    <div class="tap-to-type" id="tap-to-type" style="display:none">👆 ここをタップしてキーボードを表示</div>
  </div>
</div>

<!-- Result Screen -->
<div id="result-screen" class="screen">
  <div class="result-label">スコア</div>
  <div class="result-score" id="result-score">0</div>
  <div id="result-new-record" class="result-new-record" style="display:none">🎉 NEW RECORD!</div>
  <div class="result-stats" id="result-stats"></div>
  <div class="name-input-area" id="name-input-area">
    <input type="text" id="player-name" placeholder="名前を入力" maxlength="10">
    <button class="btn btn-primary" style="padding:12px 24px;font-size:1rem" id="save-btn" onclick="saveScore()">保存</button>
  </div>
  <div class="save-status" id="save-status"></div>
  <button class="btn btn-primary" onclick="startGame()" style="margin-top:8px">もう一回</button>
  <button class="btn btn-secondary" onclick="showRanking()">🏆 ランキング</button>
  <button class="btn btn-secondary" onclick="showTitle()">タイトルへ</button>
</div>

<!-- Ranking Screen -->
<div id="ranking-screen" class="screen">
  <div class="ranking-title">🏆 ランキング</div>
  <div class="ranking-tabs">
    <button class="ranking-tab active" id="tab-global" onclick="switchRankingTab('global')">🌍 全員</button>
    <button class="ranking-tab" id="tab-local" onclick="switchRankingTab('local')">📱 自分</button>
  </div>
  <div class="ranking-list" id="ranking-list"></div>
  <button class="btn btn-secondary" onclick="showTitle()" style="margin-top:16px">戻る</button>
</div>

<script>
// ========================================
// AUDIO ENGINE
// ========================================
let audioCtx = null;
let soundEnabled = true;
let bgmGain = null;
let bgmOscillators = [];

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('sound-toggle').textContent = soundEnabled ? '🔊' : '🔇';
  if (!soundEnabled) stopBGM();
}

function playSE(type) {
  if (!soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;

  if (type === 'correct') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(660, now);
    osc.frequency.linearRampToValueAtTime(880, now + 0.08);
    osc.frequency.linearRampToValueAtTime(1100, now + 0.15);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.25);
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(880, now + 0.03);
    osc2.frequency.linearRampToValueAtTime(1320, now + 0.15);
    gain2.gain.setValueAtTime(0.12, now + 0.03);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc2.connect(gain2).connect(audioCtx.destination);
    osc2.start(now + 0.03); osc2.stop(now + 0.3);
  }
  else if (type === 'wrong') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.linearRampToValueAtTime(100, now + 0.3);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.35);
  }
  else if (type === 'keypress') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600 + Math.random() * 200, now);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.05);
  }
  else if (type === 'countdown') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523, now);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.2);
  }
  else if (type === 'go') {
    [523, 659, 784, 1047].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + i * 0.06);
      gain.gain.setValueAtTime(0.2, now + i * 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.3);
    });
  }
  else if (type === 'combo') {
    [1200, 1500, 1800].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + i * 0.05);
      gain.gain.setValueAtTime(0.12, now + i * 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.2);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + i * 0.05); osc.stop(now + i * 0.05 + 0.2);
    });
  }
  else if (type === 'newrecord') {
    [523, 659, 784, 1047, 784, 1047, 1319].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = i % 2 === 0 ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(freq, now + i * 0.1);
      gain.gain.setValueAtTime(0.18, now + i * 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.25);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.25);
    });
  }
  else if (type === 'click') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, now);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.06);
  }
}

function startBGM() {
  if (!soundEnabled || !audioCtx) return;
  stopBGM();
  bgmGain = audioCtx.createGain();
  bgmGain.gain.setValueAtTime(0.06, audioCtx.currentTime);
  bgmGain.connect(audioCtx.destination);
  const bass = audioCtx.createOscillator();
  bass.type = 'sine';
  bass.frequency.setValueAtTime(80, audioCtx.currentTime);
  const bassGain = audioCtx.createGain();
  bassGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
  bass.connect(bassGain).connect(bgmGain);
  bass.start();
  bgmOscillators.push(bass);
  const lfo = audioCtx.createOscillator();
  lfo.type = 'square';
  lfo.frequency.setValueAtTime(4, audioCtx.currentTime);
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  lfo.connect(lfoGain).connect(bassGain.gain);
  lfo.start();
  bgmOscillators.push(lfo);
  const pad = audioCtx.createOscillator();
  pad.type = 'triangle';
  pad.frequency.setValueAtTime(220, audioCtx.currentTime);
  const padGain = audioCtx.createGain();
  padGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  pad.connect(padGain).connect(bgmGain);
  pad.start();
  bgmOscillators.push(pad);
}

function stopBGM() {
  bgmOscillators.forEach(o => { try { o.stop(); } catch(e) {} });
  bgmOscillators = [];
  bgmGain = null;
}

function setBGMIntensity(level) {
  if (!bgmGain || !audioCtx) return;
  const vol = 0.04 + level * 0.06;
  bgmGain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.1);
}

// ========================================
// QUESTIONS
// ========================================
const questions = [
  // Level 1: single chars
  { text: "a", level: 1 }, { text: "b", level: 1 }, { text: "c", level: 1 },
  { text: "d", level: 1 }, { text: "e", level: 1 }, { text: "f", level: 1 },
  { text: "g", level: 1 }, { text: "h", level: 1 }, { text: "i", level: 1 },

// ========================================
// GAME STATE
// ========================================
let score = 0, combo = 0, maxCombo = 0, totalCorrect = 0, totalWrong = 0;
let totalCharsTyped = 0;
let gameActive = false;
let timeLeft = 30000;
let timerInterval = null;
let currentQuestion = null;
let currentTarget = '';     // what user must type (lowercase)
let typedSoFar = '';
let questionStartTime = 0;
let questionsAnswered = 0;
let isMobile = false;

const GAME_DURATION = 30000;

// ========================================
// DEVICE DETECTION
// ========================================
function detectDevice() {
  isMobile = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
    || ('ontouchstart' in window && window.innerWidth < 768);
  const hint = document.getElementById('device-hint');
  if (isMobile) {
    hint.textContent = '📱 タップでソフトキーボードを使ってタイプ';
  } else {
    hint.textContent = '🖥️ キーボードで直接タイプ';
  }
}

// ========================================
// SCREENS
// ========================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showTitle() {
  stopBGM();
  showScreen('title-screen');
  const best = getBestScore();
  document.getElementById('best-score-display').textContent = best > 0 ? `ベストスコア: ${best}` : '';
}

// ========================================
// GAME LOGIC
// ========================================
function startGame() {
  initAudio();
  score = 0; combo = 0; maxCombo = 0; totalCorrect = 0; totalWrong = 0;
  totalCharsTyped = 0; questionsAnswered = 0;
  gameActive = false;
  timeLeft = GAME_DURATION;
  typedSoFar = '';
  showScreen('countdown-screen');
  doCountdown(3);
}

function doCountdown(n) {
  if (n <= 0) {
    playSE('go');
    gameActive = true;
    showScreen('game-screen');
    startBGM();
    startTimer();
    nextQuestion();
    focusInput();
    return;
  }
  const el = document.getElementById('countdown-num');
  el.textContent = n;
  el.style.animation = 'none';
  el.offsetHeight;
  el.style.animation = 'countPulse 0.6s ease-out';
  playSE('countdown');
  setTimeout(() => doCountdown(n - 1), 800);
}

function startTimer() {
  clearInterval(timerInterval);
  const startMs = performance.now();
  const timerFill = document.getElementById('timer-bar-fill');
  timerFill.style.background = 'var(--accent2)';

  timerInterval = setInterval(() => {
    const elapsed = performance.now() - startMs;
    timeLeft = Math.max(0, GAME_DURATION - elapsed);
    const pct = (timeLeft / GAME_DURATION) * 100;
    timerFill.style.width = pct + '%';
    document.getElementById('hud-timer').textContent = (timeLeft / 1000).toFixed(1);

    if (pct < 20) timerFill.style.background = 'var(--fail)';
    else if (pct < 50) timerFill.style.background = 'var(--accent)';
    else timerFill.style.background = 'var(--accent2)';

    setBGMIntensity(1 - timeLeft / GAME_DURATION);

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      endGame();
    }
  }, 50);
}

function getCurrentLevel() {
  if (questionsAnswered < 5) return 1;
  if (questionsAnswered < 12) return 2;
  return 3;
}

function nextQuestion() {
  if (!gameActive) return;

  const level = getCurrentLevel();
  const pool = questions.filter(q => q.level === level);
  const q = pool[Math.floor(Math.random() * pool.length)];
  currentQuestion = q;
  currentTarget = q.kana ? q.kana.toLowerCase() : q.text.toLowerCase();
  typedSoFar = '';
  questionStartTime = performance.now();

  // Update level badge
  const badge = document.getElementById('level-badge');
  badge.className = 'level-badge level-' + level;
  badge.textContent = level === 1 ? 'EASY' : level === 2 ? 'NORMAL' : 'HARD';

  // Update question display
  const display = document.getElementById('question-display');
  display.textContent = q.kana ? q.text : q.text.toUpperCase();
  display.style.animation = 'none';
  display.offsetHeight;
  display.style.animation = 'questionIn 0.2s ease-out';

  // Romaji hint for level 3
  const hint = document.getElementById('romaji-hint');
  hint.textContent = q.kana ? `→ ${q.kana}` : '';

  // Update HUD
  document.getElementById('hud-score').textContent = score;
  document.getElementById('hud-combo').textContent = combo > 1 ? `🔥 ${combo}コンボ` : '';

  // Build char boxes
  renderCharBoxes();

  // Show tap hint on mobile
  const tapHint = document.getElementById('tap-to-type');
  if (isMobile) {
    tapHint.style.display = 'block';
  }

  focusInput();
}

function renderCharBoxes() {
  const container = document.getElementById('typing-progress');
  container.innerHTML = '';
  for (let i = 0; i < currentTarget.length; i++) {
    const box = document.createElement('div');
    box.className = 'char-box';
    if (i < typedSoFar.length) {
      box.textContent = typedSoFar[i];
      box.classList.add('filled');
      if (typedSoFar[i] === currentTarget[i]) {
        box.classList.add('correct-char');
      }
    } else if (i === typedSoFar.length) {
      box.classList.add('current');
    }
    container.appendChild(box);
  }
}

function handleTypedChar(char) {
  if (!gameActive || !currentTarget) return;

  const expectedChar = currentTarget[typedSoFar.length];
  if (!expectedChar) return;

  char = char.toLowerCase();
  totalCharsTyped++;

  if (char === expectedChar) {
    typedSoFar += char;
    playSE('keypress');
    renderCharBoxes();

    // Word complete
    if (typedSoFar.length === currentTarget.length) {
      totalCorrect++;
      questionsAnswered++;
      combo++;
      if (combo > maxCombo) maxCombo = combo;

      // Scoring: 10 pts per char + speed bonus + combo bonus
      const charPoints = currentTarget.length * 10;
      const elapsed = performance.now() - questionStartTime;
      const speedBonus = elapsed < 2000 ? 20 : 0;
      const comboBonus = (combo % 5 === 0 && combo > 0) ? 50 : 0;
      const gained = charPoints + speedBonus + comboBonus;
      score += gained;

      showFlash('correct');
      playSE('correct');

      if (speedBonus > 0) showSpeedPopup('+' + speedBonus + ' SPEED!');
      if (comboBonus > 0) { showComboPopup(`${combo}コンボ! +50`); playSE('combo'); }
      else if (combo === 3) { showComboPopup('🔥'); playSE('combo'); }

      setTimeout(() => nextQuestion(), 250);
    }
  } else {
    // Wrong character — skip to next question
    totalWrong++;
    questionsAnswered++;
    combo = 0;
    showFlash('wrong');
    playSE('wrong');
    document.getElementById('hud-combo').textContent = '';
    setTimeout(() => nextQuestion(), 300);
  }
}

function endGame() {
  gameActive = false;
  stopBGM();
  currentQuestion = null;
  currentTarget = '';
  showResult();
}

// ========================================
// INPUT HANDLING
// ========================================
const hiddenInput = document.getElementById('hidden-input');

function focusInput() {
  if (!gameActive) return;
  hiddenInput.value = '';
  hiddenInput.focus({ preventScroll: true });
}

hiddenInput.addEventListener('input', (e) => {
  if (!gameActive) return;
  const val = e.target.value;
  if (val.length > 0) {
    // Process only the last character typed
    const lastChar = val[val.length - 1];
    handleTypedChar(lastChar);
  }
  // Always clear the input for next char
  hiddenInput.value = '';
});

// Prevent input from losing focus during game
hiddenInput.addEventListener('blur', () => {
  if (gameActive) {
    setTimeout(() => focusInput(), 100);
  }
});

// Tap on game area to focus input (mobile)
document.getElementById('question-area').addEventListener('click', () => {
  if (gameActive) {
    focusInput();
    document.getElementById('tap-to-type').style.display = 'none';
  }
});

// PC keyboard: direct key handling as backup
document.addEventListener('keydown', (e) => {
  if (!gameActive) {
    if (e.key === 'Enter' && document.getElementById('title-screen').classList.contains('active')) {
      startGame();
    }
    return;
  }

  // Only handle printable single characters (letters/numbers)
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    // The hidden input's 'input' event will handle it
    // But if the input is not focused, handle it directly
    if (document.activeElement !== hiddenInput) {
      e.preventDefault();
      handleTypedChar(e.key);
    }
  }
});

// ========================================
// VISUAL EFFECTS
// ========================================
function showFlash(type) {
  const div = document.createElement('div');
  div.className = `flash-overlay flash-${type}`;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 300);
}

function showComboPopup(text) {
  const div = document.createElement('div');
  div.className = 'combo-popup';
  div.textContent = text;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 800);
}

function showSpeedPopup(text) {
  const div = document.createElement('div');
  div.className = 'speed-popup';
  div.textContent = text;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 600);
}

// ========================================
// RESULTS
// ========================================
function showResult() {
  showScreen('result-screen');
  document.getElementById('result-score').textContent = score;

  const totalQ = totalCorrect + totalWrong;
  const accuracy = totalQ > 0 ? Math.round((totalCorrect / totalQ) * 100) : 0;
  const avgSpeed = GAME_DURATION > 0 ? (totalCharsTyped / (GAME_DURATION / 1000)).toFixed(1) : '0';

  document.getElementById('result-stats').innerHTML =
    `入力文字数: ${totalCharsTyped}<br>正解率: ${accuracy}%<br>平均速度: ${avgSpeed}文字/秒<br>最大コンボ: ${maxCombo}`;

  const best = getBestScore();
  if (score > best && score > 0) {
    document.getElementById('result-new-record').style.display = 'block';
    playSE('newrecord');
  } else {
    document.getElementById('result-new-record').style.display = 'none';
  }
  const lastName = localStorage.getItem('typingReflexLastName') || '';
  document.getElementById('player-name').value = lastName;
}

async function supabaseFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || '',
      ...options.headers,
    },
  });
  if (!res.ok) throw new Error(`Supabase error: ${res.status}`);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ========================================
// RANKING
// ========================================
let currentRankingTab = 'global';

function getLocalRankings() {
  try { return JSON.parse(localStorage.getItem('typingReflexRankings') || '[]'); }
  catch { return []; }
}

function getBestScore() {
  const rankings = getLocalRankings();
  return rankings.length > 0 ? Math.max(...rankings.map(r => r.score)) : 0;
}

async function saveScore() {
  initAudio();
  playSE('click');
  const name = document.getElementById('player-name').value.trim() || 'プレイヤー';
  localStorage.setItem('typingReflexLastName', name);

  const saveBtn = document.getElementById('save-btn');
  const statusEl = document.getElementById('save-status');
  saveBtn.disabled = true;
  saveBtn.textContent = '保存中...';
  statusEl.textContent = '';
  statusEl.style.color = 'var(--dim)';

  const totalQ = totalCorrect + totalWrong;
  const accuracy = totalQ > 0 ? Math.round((totalCorrect / totalQ) * 100) : 0;
  const avgSpeed = parseFloat((totalCharsTyped / (GAME_DURATION / 1000)).toFixed(1));

  // Save to localStorage
  const rankings = getLocalRankings();
  rankings.push({
    name, score, characters_typed: totalCharsTyped,
    accuracy, avg_speed: avgSpeed, combo: maxCombo,
    date: new Date().toLocaleDateString('ja-JP'),
  });
  rankings.sort((a, b) => b.score - a.score);
  if (rankings.length > 50) rankings.length = 50;
  localStorage.setItem('typingReflexRankings', JSON.stringify(rankings));

  // Save to Supabase
  try {
    await supabaseFetch('typing_reflex_scores', {
      method: 'POST',
      prefer: 'return=minimal',
      body: JSON.stringify({
        name, score,
        characters_typed: totalCharsTyped,
        accuracy, avg_speed: avgSpeed,
        combo: maxCombo,
      }),
    });
    statusEl.textContent = '✅ グローバルランキングに保存しました！';
    statusEl.style.color = 'var(--success)';
  } catch (e) {
    console.error('Supabase save error:', e);
    statusEl.textContent = '⚠️ オンライン保存に失敗（ローカルには保存済み）';
    statusEl.style.color = 'var(--accent)';
  }

  saveBtn.disabled = false;
  saveBtn.textContent = '保存';
}

function switchRankingTab(tab) {
  currentRankingTab = tab;
  document.getElementById('tab-global').classList.toggle('active', tab === 'global');
  document.getElementById('tab-local').classList.toggle('active', tab === 'local');
  if (tab === 'global') showGlobalRanking();
  else showLocalRanking();
}

function showRanking() {
  showScreen('ranking-screen');
  if (currentRankingTab === 'global') showGlobalRanking();
  else showLocalRanking();
}

async function showGlobalRanking() {
  const list = document.getElementById('ranking-list');
  list.innerHTML = '<div class="ranking-loading"><span class="spinner"></span>読み込み中...</div>';
  try {
    const data = await supabaseFetch('typing_reflex_scores?select=name,score,characters_typed,accuracy,avg_speed,combo,created_at&order=score.desc&limit=50');
    if (!data || data.length === 0) {
      list.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">まだ記録がありません</div>';
      return;
    }
    list.innerHTML = data.map((r, i) => {
      const date = r.created_at ? new Date(r.created_at).toLocaleDateString('ja-JP') : '';
      return `
        <div class="ranking-item">
          <div class="rank-num ${i < 3 ? 'rank-' + (i+1) : ''}">${i === 0 ? '👑' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1)}</div>
          <div class="rank-name">${escHtml(r.name)}</div>
          <div>
            <div class="rank-score">${r.score}pt</div>
            <div class="rank-date">${r.characters_typed || 0}文字 | ${r.accuracy || 0}% | 🔥${r.combo || 0} | ${date}</div>
          </div>
        </div>
      `;
    }).join('');
  } catch (e) {
    console.error('Fetch ranking error:', e);
    list.innerHTML = '<div style="text-align:center;color:var(--accent);padding:40px">⚠️ 読み込みに失敗しました<br><small>ローカルランキングをご覧ください</small></div>';
  }
}

function showLocalRanking() {
  const rankings = getLocalRankings();
  const list = document.getElementById('ranking-list');
  if (rankings.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px">まだ記録がありません</div>';
    return;
  }
  list.innerHTML = rankings.map((r, i) => `
    <div class="ranking-item">
      <div class="rank-num ${i < 3 ? 'rank-' + (i+1) : ''}">${i === 0 ? '👑' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1)}</div>
      <div class="rank-name">${escHtml(r.name)}</div>
      <div>
        <div class="rank-score">${r.score}pt</div>
        <div class="rank-date">${r.characters_typed || 0}文字 | ${r.accuracy || 0}% | ${r.date}</div>
      </div>
    </div>
  `).join('');
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
