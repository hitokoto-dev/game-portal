/* Timer bar */

  padding: 0 8px;
  margin-bottom: clamp(2px, 0.8vw, 6px);

}

  flex: 1;

  background: #F0E0E8;

}
.timer-fill {

}

/* Cross layout for choices: top, left, right, bottom */
.choices-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: auto auto auto;
  gap: clamp(4px, 1.2vw, 10px);

  max-width: 500px;
  flex: 1;
  max-height: 56dvh;
}
.choice-btn:nth-child(1) { grid-column: 2; grid-row: 1; } /* top */
.choice-btn:nth-child(2) { grid-column: 1; grid-row: 2; } /* left */
.choice-btn:nth-child(3) { grid-column: 3; grid-row: 2; } /* right */
.choice-btn:nth-child(4) { grid-column: 2; grid-row: 3; } /* bottom */
.choice-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: white;
  border: 4px solid #F0E0E8;
  border-radius: clamp(16px, 4vw, 28px);

  transition: transform 0.15s, border-color 0.2s, background 0.2s;

@keyframes correctPop {
  0% { transform: scale(1); }

  100% { transform: scale(1); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }

}

@keyframes pointFloat {
  0% { transform: translateY(0) scale(0.5); opacity: 1; }

<script>
// ===== CONFIG =====
const SUPABASE_URL = 'https://mvnhojzeshbquobffkmq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12bmhvanplc2hicXVvYmZma21xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0MjQ4NzgsImV4cCI6MjA4ODAwMDg3OH0.kJNoHqJpmC5PLuojOGrnmWBT4TMZG5HbIv7bFY1D3QI';
const TABLE = 'kids_scores';
const TOTAL_QUESTIONS = 10;

// Timer scoring: faster = more points
const TIMER_BONUS = [
  { within: 2,  points: 10, label: 'はやい！⚡' },
  { within: 4,  points: 7,  label: 'いいね！✨' },
  { within: 7,  points: 5,  label: 'おっけー！' },
  { within: Infinity, points: 3, label: '' },
];
const MAX_TIMER_BAR = 10; // Timer bar full at 10 seconds

// ===== AUDIO =====
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

// ===== BGM =====
let bgmPlaying = false;
let bgmNodes = [];
let bgmTimers = [];

function startBGM() {
  if (bgmPlaying || !audioCtx) return;
  bgmPlaying = true;

  // Cute but urgent chip-tune BGM
  const bpm = 155;
  const beat = 60 / bpm;

  // Melody: cute pentatonic with urgency (looping)
  const melodyNotes = [
    523, 659, 784, 659,  523, 784, 659, 523,
    587, 784, 880, 784,  659, 784, 523, 659,
    784, 880, 1047, 880, 784, 659, 523, 659,
    587, 523, 440, 523,  587, 659, 784, 659,
  ];
  const melodyLen = melodyNotes.length * beat * 0.5;

  // Bass: ticking pulse (urgency)
  const bassNotes = [
    262, 262, 330, 330, 294, 294, 330, 330,
    349, 349, 392, 392, 330, 330, 262, 262,
  ];
  const bassLen = bassNotes.length * beat;

  function playMelodyLoop() {
    if (!bgmPlaying) return;
    const startT = audioCtx.currentTime + 0.05;
    melodyNotes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      osc.type = 'square';
      osc.frequency.value = freq;
      filter.type = 'lowpass';
      filter.frequency.value = 2000;
      const t = startT + i * beat * 0.5;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.06, t + 0.02);
      gain.gain.setValueAtTime(0.06, t + beat * 0.35);
      gain.gain.linearRampToValueAtTime(0, t + beat * 0.48);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(arcadeAudioDestination(audioCtx));
      osc.start(t);
      osc.stop(t + beat * 0.5);
      bgmNodes.push(osc);
    });
    const tid = setTimeout(playMelodyLoop, melodyLen * 1000);
    bgmTimers.push(tid);
  }

  function playBassLoop() {
    if (!bgmPlaying) return;
    const startT = audioCtx.currentTime + 0.05;
    bassNotes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const t = startT + i * beat;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.07, t + 0.01);
      gain.gain.setValueAtTime(0.07, t + beat * 0.4);
      gain.gain.linearRampToValueAtTime(0, t + beat * 0.8);
      osc.connect(gain);
      gain.connect(arcadeAudioDestination(audioCtx));
      osc.start(t);
      osc.stop(t + beat);
      bgmNodes.push(osc);
    });
    const tid = setTimeout(playBassLoop, bassLen * 1000);
    bgmTimers.push(tid);
  }

  // Hi-hat tick for urgency
  function playTickLoop() {
    if (!bgmPlaying) return;
    const startT = audioCtx.currentTime + 0.05;
    for (let i = 0; i < 32; i++) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = 6000 + Math.random() * 2000;
      const t = startT + i * beat * 0.5;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(i % 2 === 0 ? 0.015 : 0.008, t + 0.003);
      gain.gain.linearRampToValueAtTime(0, t + 0.04);
      osc.connect(gain);
      gain.connect(arcadeAudioDestination(audioCtx));
      osc.start(t);
      osc.stop(t + 0.05);
      bgmNodes.push(osc);
    }
    const tid = setTimeout(playTickLoop, melodyLen * 1000);
    bgmTimers.push(tid);
  }

  playMelodyLoop();
  playBassLoop();
  playTickLoop();
}

function stopBGM() {
  bgmPlaying = false;
  bgmTimers.forEach(t => clearTimeout(t));
  bgmTimers = [];
  bgmNodes.forEach(n => { try { n.stop(); } catch(e) {} });
  bgmNodes = [];
}
function playSE(type) {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    if (type === 'correct') {
      [523, 659, 784].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.3, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.3);
        osc.connect(gain);
        gain.connect(arcadeAudioDestination(audioCtx));
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.3);
      });
    } else if (type === 'wrong') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = 300;
      osc.frequency.linearRampToValueAtTime(200, now + 0.25);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.connect(gain);
      gain.connect(arcadeAudioDestination(audioCtx));
      osc.start(now);
      osc.stop(now + 0.3);
    } else if (type === 'countdown') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.connect(gain);
      gain.connect(arcadeAudioDestination(audioCtx));
      osc.start(now);
      osc.stop(now + 0.15);
    } else if (type === 'start') {
      [523, 659, 784, 1047].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.25, now + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.25);
        osc.connect(gain);
        gain.connect(arcadeAudioDestination(audioCtx));
        osc.start(now + i * 0.1);
        osc.stop(now + i * 0.1 + 0.25);
      });
    } else if (type === 'result') {
      [523, 659, 784, 1047, 1319].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, now + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.4);
        osc.connect(gain);
        gain.connect(arcadeAudioDestination(audioCtx));
        osc.start(now + i * 0.12);
        osc.stop(now + i * 0.12 + 0.4);
      });
    } else if (type === 'tick') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 600;
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.connect(gain);
      gain.connect(arcadeAudioDestination(audioCtx));
      osc.start(now);
      osc.stop(now + 0.05);
    }
  } catch (e) {}
}

// Generate number comparison questions dynamically
function generateNumberQuestion() {
  // Difficulty ranges for kids
  const ranges = [
    { min: 1, max: 10 },
    { min: 1, max: 20 },
    { min: 10, max: 50 },
    { min: 1, max: 100 },
  ];
  const range = ranges[Math.floor(Math.random() * ranges.length)];

  // Generate 4 unique numbers
  const nums = new Set();
  while (nums.size < 4) {
    nums.add(Math.floor(Math.random() * (range.max - range.min + 1)) + range.min);
  }
  const numArr = [...nums];
  const maxVal = Math.max(...numArr);
  const answerIdx = numArr.indexOf(maxVal);

  return {
    type: 'number',
    isNumber: true,
    choices: numArr.map(n => ({ e: String(n), l: '' })),
    answer: answerIdx,
  };
}

function buildQuestions() {
  gameQuestions = [];
  // Pick from big, heavy, tall (3 each) + number (dynamic)
  const staticTypes = ['big', 'heavy', 'tall'];
  staticTypes.forEach(key => {
    const sets = [...questions[key].sets];
    shuffle(sets);
    for (let i = 0; i < 3 && i < sets.length; i++) {
      gameQuestions.push({ type: key, ...sets[i] });
    }
  });
  // Add number questions (fill remaining to TOTAL_QUESTIONS)
  const numNeeded = TOTAL_QUESTIONS - gameQuestions.length;
  for (let i = 0; i < numNeeded; i++) {
    gameQuestions.push(generateNumberQuestion());
  }
  shuffle(gameQuestions);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startTimer() {

  timerInterval = setInterval(() => {
    const elapsed = (performance.now() - questionStartTime) / 1000;
    timerText.textContent = elapsed.toFixed(1);
    const pct = Math.max(0, 100 - (elapsed / MAX_TIMER_BAR) * 100);
    timerFill.style.width = pct + '%';
  }, 100);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  return (performance.now() - questionStartTime) / 1000;
}

function getTimerScore(elapsed) {
  for (const tier of TIMER_BONUS) {
    if (elapsed <= tier.within) return tier;
  }
  return TIMER_BONUS[TIMER_BONUS.length - 1];
}

function showQuestion() {
  if (currentQuestion >= gameQuestions.length) {
    showResult();
    return;
  }
  isAnswering = false;
  const q = gameQuestions[currentQuestion];
  const typeData = questions[q.type];

  document.getElementById('q-icon').textContent = typeData.icon;
  document.getElementById('q-text').textContent = typeData.text;
  document.getElementById('score-display').textContent = '⭐ ' + score;
  document.getElementById('progress-fill').style.width = ((currentQuestion) / TOTAL_QUESTIONS * 100) + '%';

  const grid = document.getElementById('choices-grid');
  grid.innerHTML = '';
  q.choices.forEach((c, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    if (q.isNumber) {
      btn.innerHTML = `<span class="number-display">${c.e}</span>`;
    } else {
      btn.innerHTML = `<span class="emoji">${c.e}</span><span class="label">${c.l}</span>`;
    }
    btn.onclick = () => handleAnswer(idx);
    grid.appendChild(btn);
  });

  // Start timer for this question
  startTimer();
}

// ===== HANDLE ANSWER =====
function handleAnswer(idx) {
  if (isAnswering) return;
  isAnswering = true;

  const elapsed = stopTimer();
  const q = gameQuestions[currentQuestion];
  const btns = document.querySelectorAll('.choice-btn');
  const isCorrect = idx === q.answer;

  if (isCorrect) {
    const tier = getTimerScore(elapsed);
    btns[idx].classList.add('correct');
    score += tier.points;
    correctCount++;
    playSE('correct');
    showFeedback(true);
    spawnStars(btns[idx]);
    showPointPopup(btns[idx], tier.points, tier.label);
  } else {
    btns[idx].classList.add('wrong');
    btns[q.answer].classList.add('correct');
    playSE('wrong');
    showFeedback(false);
  }

  document.getElementById('score-display').textContent = '⭐ ' + score;

  setTimeout(() => {
    currentQuestion++;
    showQuestion();
  }, isCorrect ? 1000 : 1400);
}

// ===== SUPABASE =====
async function supabaseFetch(path, options = {}) {
  if (options.method && options.method !== 'GET') return null;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || '',
      ...options.headers,
    },
  });
  if (!res.ok) throw new Error(`Supabase error: ${res.status}`);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function saveScore() {
  const nameInput = document.getElementById('name-input');
  const name = nameInput.value.trim() || 'ななし';
  localStorage.setItem('arcade-v2:kids_quiz_name', name);

  // Save to local
  const localScores = JSON.parse(localStorage.getItem('arcade-v2:kids_quiz_local') || '[]');
  localScores.unshift({ name, score, correct: correctCount, total: TOTAL_QUESTIONS, date: new Date().toISOString() });
  if (localScores.length > 50) localScores.length = 50;
  localStorage.setItem('arcade-v2:kids_quiz_local', JSON.stringify(localScores));

  // Save to Supabase
  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.textContent = 'ほぞんちゅう...';
  try {
    await supabaseFetch(TABLE, {
      method: 'POST',
      prefer: 'return=minimal',
      body: JSON.stringify({ name, score, correct: correctCount, total: TOTAL_QUESTIONS }),
    });
    btn.textContent = 'ほぞん した！ ✅';
  } catch (e) {
    btn.textContent = 'ほぞん した！ ✅';
  }
}

  list.innerHTML = data.map((d, i) => {
    const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
    return `<div class="rank-item">
      <div class="rank-num ${rankClass}">${medal}</div>
      <div class="rank-name">${escHtml(d.name)}</div>
      <div class="rank-score">⭐${d.score}</div>
      <div class="rank-detail">${d.correct || 0}/${d.total || TOTAL_QUESTIONS}</div>
    </div>`;
  }).join('');
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
